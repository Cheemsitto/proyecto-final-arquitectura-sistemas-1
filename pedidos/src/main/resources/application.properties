spring.application.name=pedidos

# Lee las variables del archivo .env de esta carpeta (si existe).
# Las variables de entorno reales del sistema o de la nube tienen prioridad.
spring.config.import=optional:file:.env[.properties]

server.port=${PORT:8082}
# Detrás de un túnel o proxy HTTPS, usa la dirección pública en Swagger
server.forward-headers-strategy=framework

# Base de datos propia del servicio de pedidos
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:pedidos_db}?createDatabaseIfNotExist=true&serverTimezone=UTC&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&sslMode=${DB_SSL_MODE:PREFERRED}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.jackson.deserialization.accept-float-as-int=false

# Comunicacion con el servicio de productos
productos.url=${PRODUCTOS_URL:http://localhost:3001}
productos.timeout-ms=${PRODUCTOS_TIMEOUT_MS:3000}
productos.service-key=${PRODUCTOS_SERVICE_KEY:}

# Clave que debe enviar el broker en X-Service-Key
seguridad.service-key=${SERVICE_KEY:}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
